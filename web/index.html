<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CAMERA OVERVIEW</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#0b0f14;color:#e7eef7}
    header{padding:14px 18px;border-bottom:1px solid #1c2633;background:#0b0f14;position:sticky;top:0;z-index:10;text-align:center}
    h1{font-size:20px;margin:0;letter-spacing:.6px}
    .sub{margin:8px auto 0;color:#9fb2c8;font-size:12.5px;line-height:1.35;max-width:920px}
    .grid{display:grid;gap:12px;padding:12px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
    .card{background:#121a24;border:1px solid #1c2633;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.25)}
    .cardhead{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
    .name{font-weight:800}
    .actions{display:flex;gap:10px;align-items:center}
    .actions a{color:#8ab4ff;text-decoration:none;font-size:13px}
    .actions button{font-size:12px;border:1px solid #1c2633;background:#0b0f14;color:#e7eef7;border-radius:10px;padding:6px 10px;cursor:pointer}
    .frame{aspect-ratio:16/9;background:#0b0f14}
    iframe{width:100%;height:100%;border:0;display:block}
    .statswrap{display:flex;justify-content:center}
    .stats{margin:12px;padding:12px;border:1px solid #1c2633;border-radius:14px;background:#101824;max-width:1120px}
    .row{display:flex;gap:14px;flex-wrap:wrap}
    .pill{flex:1;min-width:220px;border:1px solid #1c2633;border-radius:12px;padding:10px;background:#0b0f14}
    .k{color:#9fb2c8;font-size:12px}
    .v{font-size:18px;font-weight:800;margin-top:3px}
  </style>
</head>
<body>
  <header>
    <h1>CAMERA OVERVIEW</h1>
    <div class="sub">
      Stream loads only after clicking <b>START</b> (lower data usage).<br/>
      If you see a black screen: click <b>OPEN</b> and come back.
    </div>
  </header>

  <div class="statswrap">
    <section class="stats">
      <div class="row">
        <div class="pill">
          <div class="k">Monthly limit</div>
          <div class="v"><span id="limitGb">20</span> GB</div>
        </div>
        <div class="pill">
          <div class="k">Used</div>
          <div class="v"><span id="usedGb">-</span> GB</div>
        </div>
        <div class="pill">
          <div class="k">Remaining</div>
          <div class="v"><span id="leftGb">-</span> GB</div>
        </div>
      </div>
      <div class="sub">Source: <code>/usage.json</code> generated by <code>usage_monthly.sh</code></div>
    </section>
  </div>

  <div class="grid" id="grid"></div>

<script>
  const LIMIT_GB = 20;
  const GO2RTC_BASE = `${window.location.protocol}//${window.location.hostname}:1984`;

  const cams = [
    { src: "KAMERA_GARAZ",  title: "KAMERA_GARAZ"  },
    { src: "KAMERA_TYL",    title: "KAMERA_TYL"    },
    { src: "KAMERA_ZACHOD", title: "KAMERA_ZACHOD" }
  ];

  function gb(bytes){ return (bytes / (1024 ** 3)); }

  async function refreshUsage() {
    try {
      const r = await fetch("/usage.json", { cache: "no-store" });
      const j = await r.json();
      const used = gb(j.total_bytes || 0);
      const left = Math.max(0, LIMIT_GB - used);
      document.getElementById("limitGb").textContent = LIMIT_GB.toFixed(0);
      document.getElementById("usedGb").textContent = used.toFixed(2);
      document.getElementById("leftGb").textContent = left.toFixed(2);
    } catch (e) {
      document.getElementById("usedGb").textContent = "-";
      document.getElementById("leftGb").textContent = "-";
    }
  }

  function makeCard(cam) {
    const streamUrl = `${GO2RTC_BASE}/stream.html?src=${encodeURIComponent(cam.src)}`;

    const card = document.createElement("section");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "cardhead";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = cam.title;

    const actions = document.createElement("div");
    actions.className = "actions";

    const open = document.createElement("a");
    open.href = streamUrl;
    open.target = "_blank";
    open.rel = "noreferrer";
    open.textContent = "OPEN";

    const start = document.createElement("button");
    start.textContent = "START";

    const stop = document.createElement("button");
    stop.textContent = "STOP";

    const frame = document.createElement("div");
    frame.className = "frame";

    const iframe = document.createElement("iframe");
    iframe.allow = "autoplay; fullscreen; camera; microphone";
    iframe.style.display = "none";

    start.onclick = () => {
      iframe.src = streamUrl;
      iframe.style.display = "block";
    };

    stop.onclick = () => {
      iframe.src = "";
      iframe.style.display = "none";
    };

    actions.appendChild(open);
    actions.appendChild(start);
    actions.appendChild(stop);

    head.appendChild(name);
    head.appendChild(actions);

    frame.appendChild(iframe);

    card.appendChild(head);
    card.appendChild(frame);
    return card;
  }

  const grid = document.getElementById("grid");
  cams.forEach((c) => grid.appendChild(makeCard(c)));

  refreshUsage();
  setInterval(refreshUsage, 5000);
</script>
</body>
</html>
